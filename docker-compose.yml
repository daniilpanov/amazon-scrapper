services:
    ### EXTERNAL
    msgbroker:
        image: danielgreen1806/amascrap-rabbitmq:latest
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
            - "15674:15674"
            - "61613:61613"
            - "55670:55670"
        networks:
            - net
        volumes:
            - ./external-data/rabbitmq/mnesia:/var/lib/rabbitmq/mnesia:rw
            - ./logs/rabbitmq:/var/log/rabbitmq:rw
    ### WORKERS
    cron:
        depends_on:
             - msgbroker
        image: danielgreen1806/amascrap-cron:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./services/cron/app:/src:rw
            - ./services/cron/cron_tasks:/res/crontabs:rw
            - ./logs/cron:/var/log:rw
        command: ["/src/cron-start.sh"]
    msgbroker_handler:
        depends_on:
            msgbroker:
                condition: service_started
        image: danielgreen1806/amascrap-light:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/msgbroker_handler/app:/src/app:rw
            - ./logs/msgbroker_handler:/src/logs:rw
        env_file: .env
    ### SERVICE
    s3:
        image: danielgreen1806/amascrap-s3:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/s3:/src:rw
            - ./logs/s3:/src/logs:rw
        env_file: .env
        expose:
            - "$S3_PORT"
        ports:
            - "$S3_PORT:$S3_PORT"
        entrypoint:
            - "gunicorn"
            - "app:app"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$S3_PORT"
    ### LEGACY PART
    server:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/server:/src:rw
            - ./logs/server:/src/logs:rw
        env_file: .env
        expose:
            - "$SERVER_PORT"
        ports:
            - "$SERVER_PORT:$SERVER_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
    s3_upload:
        depends_on:
            - server
        image: danielgreen1806/amascrap-s3:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/s3_upload:/src:rw
            - ./logs/s3_upload:/src/logs:rw
        env_file: .env
        entrypoint:
            - "python"
            - "app/serve.py"
    web:
        depends_on:
            - server
        image: danielgreen1806/amascrap-simple_server:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/web:/src:rw
            - ./logs/web:/src/logs:rw
        env_file: .env
        expose:
            - "$WEB_PORT"
        ports:
            - "$WEB_PORT:$WEB_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$WEB_PORT"
networks:
    net:
