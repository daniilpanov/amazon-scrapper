services:
    ### EXTERNAL
    msgbroker:
        image: danielgreen1806/amascrap-rabbitmq:latest
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
            - "15674:15674"
            - "61613:61613"
            - "55670:55670"
        networks:
            - net
        volumes:
            - ./external-data/rabbitmq/mnesia:/var/lib/rabbitmq/mnesia:rw
            - ./logs/rabbitmq:/var/log/rabbitmq:rw
    ### CHROME VNC SERVICE
    chrome-vnc:
        depends_on:
            - msgbroker
        image: danielgreen1806/amascrap-chrome-vnc:latest
        ports:
            - "5900:5900"  # VNC access
        networks:
            - net
        environment:
            - VNC_PASSWORD=${VNC_PASSWORD}
        volumes:
            - ./dockerfiles/uniscrap/start.sh:/home/chrome/start.sh:r
            - ./logs/uniscrap:/home/chrome/logs:rw
            - ./external-data/chrome-profile:/home/chrome/profile:rw
        security_opt:
            - seccomp=unconfined
            - apparmor=unconfined
        cap_add:
            - SYS_ADMIN
        shm_size: 2g
        restart: unless-stopped
    ### WORKERS
    cron:
        depends_on:
             - msgbroker
        image: danielgreen1806/amascrap-cron:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./services/cron/app:/src:rw
            - ./services/cron/cron_tasks:/res/crontabs:rw
            - ./logs/cron:/var/log:rw
        command: ["/src/cron-start.sh"]
    msgbroker_handler:
        depends_on:
            msgbroker:
                condition: service_started
        image: danielgreen1806/amascrap-light:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/msgbroker_handler/app:/src/app:rw
            - ./logs/msgbroker_handler:/src/logs:rw
        env_file: .env
    ### LEGACY PART
    server:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/server:/src:rw
            - ./logs/server:/src/logs:rw
        env_file: .env
        expose:
            - "$SERVER_PORT"
        ports:
            - "$SERVER_PORT:$SERVER_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
    web:
        depends_on:
            - server
        image: danielgreen1806/amascrap-simple_server:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./services/web:/src:rw
            - ./logs/web:/src/logs:rw
        env_file: .env
        expose:
            - "$WEB_PORT"
        ports:
            - "$WEB_PORT:$WEB_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$WEB_PORT"
networks:
    net:
