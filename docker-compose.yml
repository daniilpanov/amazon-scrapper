services:
    bsrstarter:
        build:
            context: ./bsr_starter_service
            target: bsrstarter
            dockerfile: Dockerfile
        restart: always
        networks:
            - net
        volumes:
            - ./bsr_starter_service:/app:rw
    dataimporter:
        build:
            context: ./dataimporter_service
            target: dataimporter
            dockerfile: Dockerfile
        restart: always
        networks:
            - net
        volumes:
            - ./dataimporter_service:/app:rw
        env_file: dataimporter.env
