services:
    ### EXTERNAL
    msgbroker:
        image: danielgreen1806/amascrap-rabbitmq:latest
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
            - "15674:15674"
            - "61613:61613"
            - "55670:55670"
        networks:
            - net
        volumes:
            - ./msgbroker/internal-data/mnesia:/var/lib/rabbitmq/mnesia:rw
            - ./msgbroker/logs:/var/log/rabbitmq:rw
    ### CHROME VNC SERVICE
    chrome-vnc:
        depends_on:
            - msgbroker
        image: danielgreen1806/amascrap-chrome-vnc:latest
        ports:
            - "5900:5900"  # VNC access
        networks:
            - net
        environment:
            - VNC_PASSWORD=${VNC_PASSWORD}
        volumes:
            - ./dockerfiles/uniscrap/start.sh:/home/chrome/start.sh:r
            - ./logs/uniscrap:/home/chrome/logs:rw
            - ./external-data/chrome-profile:/home/chrome/profile:rw
        security_opt:
            - seccomp=unconfined
            - apparmor=unconfined
        cap_add:
            - SYS_ADMIN
        shm_size: 2g
        restart: unless-stopped
    ### WORKERS
    app_main:
        depends_on:
            msgbroker:
                condition: service_started
        image: danielgreen1806/amascrap-app:latest
        restart: on-failure
        networks:
            - net
        volumes:
            - ./app_main/serve.py:/src/serve.py:ro
            - ./app_main/app:/src/app:ro
            - ./logs/app_main:/src/logs:rw
        env_file: .env
        ports:
            - "${APP_PORT:-8080}:8080"
    cron:
        depends_on:
            - app_main
        image: danielgreen1806/amascrap-cron:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./cron/cron-start.sh:/src/cron-start.sh:r
            - ./cron/crontab:/res/crontabs/root:ro
            - ./logs/cron:/var/log:rw
        command: ["/src/cron-start.sh"]
networks:
    net:
