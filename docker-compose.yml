services:
    bsrstarter:
        depends_on:
            - server
        image: danielgreen1806/amascrap-light:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/bsr_starter_service:/src:rw
    dataimporter:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/dataimporter_service:/src:rw
        env_file: .env
        expose:
            - "$DATA_IMPORTER_PORT"
        ports:
            - "$DATA_IMPORTER_PORT:$DATA_IMPORTER_PORT"
        command:
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
    proxies:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/proxies_service:/src:rw
        env_file: .env
        expose:
            - "$PROXIES_PORT"
        ports:
            - "$PROXIES_PORT:$PROXIES_PORT"
        command:
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
    s3:
        image: danielgreen1806/amascrap-s3:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/s3_service:/src:rw
        env_file: .env
        expose:
            - "$S3_PORT"
        ports:
            - "$S3_PORT:$S3_PORT"
        entrypoint:
            - "gunicorn"
            - "app:app"
        command:
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
