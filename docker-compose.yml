services:
    ext_packer:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./services/ext_packer_service/app:/src/app:rw
            - ./logs/ext_packer:/src/logs:rw
            - ./extensions:/src/ext:r
            - ./extensions:/src/compiled_ext:rw
            - ./extensions:/src/update_metadata:rw
        expose:
            - "$EXT_PACKER_PORT"
        ports:
            - "$EXT_PACKER_PORT:$EXT_PACKER_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$EXT_PACKER_PORT"
    bsrstarter:
        depends_on:
            - server
        image: danielgreen1806/amascrap-light:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./services/bsr_starter_service:/src:rw
            - ./logs/bsrstarter:/src/logs:rw
    100asinshandler:
        depends_on:
            - server
        image: danielgreen1806/amascrap-light:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./services/100asins_handler_service:/src:rw
            - ./logs/100asinshandler:/src/logs:rw
    cron:
        depends_on:
             - msgbroker
        image: danielgreen1806/amascrap-cron:latest
        restart: unless-stopped
        networks:
            - net
        env_file: .env
        volumes:
            - ./services/cron_starter_service/app:/src:rw
            - ./services/cron_starter_service/cron_tasks:/res/crontabs:rw
            - ./logs/cron:/var/log:rw
        command: ["/src/cron-start.sh"]
    dataimporter:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/dataimporter_service:/src:rw
            - ./logs/dataimporter:/src/logs:rw
        env_file: .env
        expose:
            - "$DATA_IMPORTER_PORT"
        ports:
            - "$DATA_IMPORTER_PORT:$DATA_IMPORTER_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$DATA_IMPORTER_PORT"
    proxies:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/proxies_service:/src:rw
            - ./logs/proxies:/src/logs:rw
        env_file: .env
        expose:
            - "$PROXIES_PORT"
        ports:
            - "$PROXIES_PORT:$PROXIES_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$PROXIES_PORT"
    s3:
        image: danielgreen1806/amascrap-s3:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/s3_service:/src:rw
            - ./logs/s3:/src/logs:rw
        env_file: .env
        expose:
            - "$S3_PORT"
        ports:
            - "$S3_PORT:$S3_PORT"
        entrypoint:
            - "gunicorn"
            - "app:app"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$S3_PORT"
    google:
        image: danielgreen1806/amascrap-google:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/google_service:/src:rw
            - ./logs/google:/src/logs:rw
        env_file: .env
        expose:
            - "$GOOGLE_PORT"
        ports:
            - "$GOOGLE_PORT:$GOOGLE_PORT"
        entrypoint:
            - "gunicorn"
            - "app:app"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$GOOGLE_PORT"
    s3_upload:
        depends_on:
            - server
        image: danielgreen1806/amascrap-s3:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/s3_upload_service:/src:rw
            - ./logs/s3_upload:/src/logs:rw
        env_file: .env
        entrypoint:
            - "python"
            - "app/serve.py"
    google_upload:
        depends_on:
            - server
        image: danielgreen1806/amascrap-google:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/google_upload_service:/src:rw
            - ./logs/google_upload:/src/logs:rw
        env_file: .env
        entrypoint:
            - "python"
            - "app/serve.py"
    bsr_loader:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/amazon_departments_loader:/src:rw
            - ./logs/amazon_bsr_loader:/src/logs:rw
        env_file: .env
        expose:
            - "$BSR_PORT"
        ports:
            - "$BSR_PORT:$BSR_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$BSR_PORT"
    server:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/server_service:/src:rw
            - ./logs/server:/src/logs:rw
        env_file: .env
        expose:
            - "$SERVER_PORT"
        ports:
            - "$SERVER_PORT:$SERVER_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
    sellercentral_loader:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/sellercentral_loader:/src:rw
            - ./logs/sellercentral:/src/logs:rw
        env_file: .env
        expose:
            - "$SELLERCENTRAL_PORT"
        ports:
            - "$SELLERCENTRAL_PORT:$SELLERCENTRAL_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$SELLERCENTRAL_PORT"
    web:
        depends_on:
            - server
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/web:/src:rw
            - ./logs/web:/src/logs:rw
        env_file: .env
        expose:
            - "$WEB_PORT"
        ports:
            - "$WEB_PORT:$WEB_PORT"
        command:
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-b"
            - "0.0.0.0:$WEB_PORT"
    msgbroker:
        image: danielgreen1806/amascrap-rabbitmq:latest
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
            - "15674:15674"
            - "61613:61613"
            - "55670:55670"
        networks:
            - net
        volumes:
            - ./logs/rabbitmq:/var/log/rabbitmq:rw
