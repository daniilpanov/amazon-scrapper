    s3_upload:
        depends_on:
            - server
        image: danielgreen1806/amascrap-s3:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/s3_upload_service:/src:rw
        env_file: .env
        entrypoint:
            - "python"
            - "app/serve.py"
    google_upload:
        depends_on:
            - server
        image: danielgreen1806/amascrap-google:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/google_upload_service:/src:rw
        env_file: .env
        entrypoint:
            - "python"
            - "app/serve.py"
    server:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/server_service:/src:rw
        env_file: .env
        expose:
            - "$SERVER_PORT"
        ports:
            - "$SERVER_PORT:$SERVER_PORT"
        command:
            - "-b"
            - "0.0.0.0:$SERVER_PORT"
    sellercentral_loader:
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/sellercentral_loader:/src:rw
        env_file: .env
        expose:
            - "$SELLERCENTRAL_PORT"
        ports:
            - "$SELLERCENTRAL_PORT:$SELLERCENTRAL_PORT"
        command:
            - "-b"
            - "0.0.0.0:$SELLERCENTRAL_PORT"
    web:
        depends_on:
            - server
        image: danielgreen1806/amascrap-simple_server:latest
        restart: unless-stopped
        networks:
            - net
        volumes:
            - ./services/web:/src:rw
        env_file: .env
        expose:
            - "$WEB_PORT"
        ports:
            - "$WEB_PORT:$WEB_PORT"
        command:
            - "-b"
            - "0.0.0.0:$WEB_PORT"
