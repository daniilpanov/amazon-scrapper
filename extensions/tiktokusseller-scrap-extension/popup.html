<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tiktok</title>

    <style>
        body {
            height: 270px;
            width: 320px;
            background-color: #FF9900;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .container {
            height: 98%;
            width: 98%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            border-radius: 7vh;
            box-shadow: 0 3px 4px rgba(0, 0, 0, 0.5);
        }


        .parse_button {
            background-color: #FF9900;
            width: 85px;
            height: 40px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            border: solid 0;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
            border-radius: 5vh;
        }

        .parse_button:hover {
            background-color: #a86500;

        }

        h1 {
            color: white;
            background-color: #FF9900;
            border-radius: 4vh;
            border: 1px solid black;
            padding: 7px;
            text-align: center;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Tiktok Seller Us Scraper</h1>
<!--    <h3 id="status" style="color: white;">Status: not started</h3>-->

    <div style="display: flex; flex-direction: row;">
        <!--<p style="font-size: large; font-weight: 900; color: #ffffff;" id="pagesCounter">0</p>
        <p style="font-size: large; font-weight: 900; color: #ffffff;">&nbsp;/&nbsp;</p>-->
        <p style="font-size: large; font-weight: 900; color: #ffffff;"><label for="totalPagesCount">Please enter the quantity limit:</label></p>
        <p style="font-size: large; font-weight: 900; color: #ffffff;"><input type="number" name="totalPagesCount" id="totalPagesCount" value="100"></p>
    </div>

    <button class="parse_button" id="toParseButton">
        Scrape
    </button>

    <button class="parse_button" id="toFullParseButton">
        Full Scrape
    </button>

</div>

<script src="./popup.js" type="module"></script>
</body>

</html>
